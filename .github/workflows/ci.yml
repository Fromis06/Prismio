name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL and SQL Server data-safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Static analysis
        run: go vet ./...

      - name: Compile and run package tests with race detection
        run: go test -race -count=1 ./...

      - name: Start integration-test services
        run: docker compose -f compose.integration.yml up -d --wait --wait-timeout 180

      - name: Run PostgreSQL and SQL Server integrity, rollback and recovery tests
        run: go test -race -tags=integration ./tests/integration/... -v -count=1 -timeout=180s

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.integration.yml logs --no-color

      - name: Stop integration-test services
        if: always()
        run: docker compose -f compose.integration.yml down -v
