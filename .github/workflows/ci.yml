name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and data-safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile and run package tests
        run: go test ./...

      - name: Start integration-test services
        run: docker compose -f compose.integration.yml up -d --wait

      - name: Run data-integrity and crash-recovery tests
        run: go test -tags=integration ./tests/integration/... -v -count=1 -timeout=60s

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.integration.yml logs --no-color

      - name: Stop integration-test services
        if: always()
        run: docker compose -f compose.integration.yml down -v
